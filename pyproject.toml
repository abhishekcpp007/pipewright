[project]
name = "pipewright"
version = "0.1.0"
description = "An incremental ELT warehouse with SCD2 dimensions, declarative data quality gates and a DAG runner that can resume."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
pw = "pw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pw"]

[tool.hatch.build]
artifacts = ["pw/models/*.sql", "pw/expectations.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]
